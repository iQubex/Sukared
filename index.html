<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>Luavex Beta</title>
    <link rel="icon" type="image/png" href="/assets/luavex-brand.png">
    <link rel="stylesheet" href="/style.css?v=luavex-brand-1">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell" id="appShell">
        <header class="site-header">
            <a class="brand" href="/workspace" data-route aria-label="Luavex workspace">
                <span class="brand-icon-crop" aria-hidden="true"><img src="/assets/luavex-brand.png" alt=""></span>
                <span class="brand-wordmark-crop" aria-hidden="true"><img src="/assets/luavex-brand.png" alt=""></span>
                <span class="sr-only">Luavex</span>
                <span class="beta-badge">BETA</span>
            </a>
            <button class="nav-toggle icon-button" id="navToggle" type="button" aria-label="Open navigation" aria-expanded="false"></button>
            <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
                <a href="/workspace" data-route data-nav="workspace">Workspace</a>
                <a href="/changelog" data-route data-nav="changelog">Changelog</a>
            </nav>
            <button class="settings-nav icon-button" id="globalSettings" type="button" aria-label="Open settings" title="Settings"></button>
        </header>

        <main id="routeView" class="route-view" tabindex="-1"></main>

        <footer class="site-footer">
            <span>Luavex Beta</span>
            <span>Public Beta</span>
            <span>Local history · No source retention</span>
            <nav aria-label="Footer navigation">
                <a href="/changelog" data-route>Changelog</a>
                <a href="/history" data-route>History</a>
            </nav>
        </footer>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="/app/history-store.js?v=luavex-brand-1"></script>
    <script src="/app/icons.js?v=luavex-brand-1"></script>
    <script src="/app/motion.js?v=luavex-brand-1"></script>
    <script src="/app/router.js?v=luavex-brand-1"></script>
    <script src="/app/ui.js?v=luavex-brand-1"></script>
    <script src="/app/landing.js?v=luavex-brand-1"></script>
    <script src="/app/transition.js?v=luavex-brand-1"></script>
    <script src="/app/changelog-data.js?v=luavex-brand-1"></script>
    <script src="/app/dashboard.js?v=luavex-brand-1"></script>
    <script src="/app/views.js?v=luavex-brand-1"></script>
    <script src="/app/main.js?v=luavex-brand-1"></script>
</body>
</html>
